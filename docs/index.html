<style>
:root{--bg:#faf7f2;--panel:#fff;--border:#e5dfd5;--text:#2c2416;--t2:#6b5e4a;--t3:#9b8c78;--a:#8b2500;--al:#f5ede4;--g:#b8860b;--gn:#2d6a4f;--r:#c1121f;--b:#1d3557;--s:'Noto Serif SC','SimSun',serif;--m:'IBM Plex Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--s);background:var(--bg);color:var(--text);line-height:1.7}
a{color:var(--a);text-decoration:none}a:hover{text-decoration:underline}
.app{max-width:1200px;margin:0 auto;padding:0 20px}
.header{padding:36px 0 20px;text-align:center;border-bottom:2px solid var(--a);margin-bottom:20px}
.header h1{font-size:28px;font-weight:700;letter-spacing:2px}.sub{color:var(--t2);font-size:14px;margin:4px 0}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;padding:3px 10px;border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--t2);font-family:var(--m)}
.nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.nav-btn{padding:10px 16px;border:none;background:none;font-family:var(--s);font-size:14px;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-btn:hover{color:var(--a)}.nav-btn.active{color:var(--a);border-bottom-color:var(--a);font-weight:600}
.panel{display:none}.panel.active{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:12px}
.card-title{font-size:16px;font-weight:700;margin-bottom:6px}
.card-body{font-size:14px;line-height:1.8}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--a);font-family:var(--m)}.stat-label{font-size:12px;color:var(--t3);margin-top:2px}
.conf{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600}
.c1{background:#d4edda;color:var(--gn)}.c2{background:#fff3cd;color:#856404}.c3{background:#e2e3e5;color:#383d41}.c4{background:#f8d7da;color:var(--r)}
.er{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid #f0ebe0;font-size:13px;align-items:flex-start}.er:last-child{border-bottom:none}
.fc{border-left:4px solid var(--a);padding-left:14px}
.tl{position:relative;padding-left:24px}.tl::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.ti{position:relative;margin-bottom:20px}.ti::before{content:'';position:absolute;left:-20px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--a);border:2px solid var(--bg)}
.srch{margin-bottom:14px}.srch input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-family:var(--s);font-size:14px;background:var(--panel);outline:none}.srch input:focus{border-color:var(--a)}
.flt{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.flt-chip{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer}.flt-chip.active{background:var(--a);color:#fff;border-color:var(--a)}
.footer{text-align:center;padding:28px 0;color:var(--t3);font-size:11px;border-top:1px solid var(--border);margin-top:28px}
@media(max-width:768px){.header h1{font-size:22px}.nav-btn{padding:8px 12px;font-size:12px}}
</style>
</head>

var R={确定:"c1",极有可能:"c2",有可能:"c3",存疑:"c4"},ETC={脂批直接提示:"et1",判词谶语:"et1","判词/谶语":"et2","前80回文本伏笔":"et3",文本伏笔:"et3","人物性格逻辑":"et4",其他:"et4"},SIG={核心:"十二钗正册",重要:"副册/又副册",次要:"重要配角",边缘:"边缘人物"};
var CHARACTERS=[{id:"CHAR-01",name:"贾宝玉",alias:["怡红公子","绛洞花主","富贵闲人"],significance:"核心",fateSummary:"罹难狱神庙，经甄宝玉送玉而'梦醒'，最终悬崖撒手出家为僧",fateDetail:"黛玉死后宝玉被迫娶宝钗，婚后'空对着山中高士晶莹雪，终不忘世外仙姝寂寞林'。贾府事败被抄，宝玉与凤姐等曾羁押于狱神庙，茜雪小红等前往探慰。后经甄宝玉送还通灵玉，宝玉经历'甄''假'之辨后彻悟出家。脂批称其'悬崖撒手'。",confidence:"确定",supporting:["FS-001","FS-005","FS-018","FS-024","FS-029"],contradicting:[],quote:"看破的，遁入空门；痴迷的，枉送了性命。",alt:[]},{id:"CHAR-02",name:"林黛玉",alias:["颦颦","潇湘妃子","颦儿"],significance:"核心",fateSummary:"'泪尽夭亡'——因宝玉罹难急痛忧忿加速泪尽，十七岁春末病逝",fateDetail:"绛珠仙草下世即为'还泪'——泪尽即归天。主流探佚学认为黛玉系'泪尽夭亡'而非程高本'焚稿断情'。关键脂批揭示：绛珠之泪'不因离恨而落，为惜其石而落'、'至死不干，万苦不怨'。黛玉之死无怨恨，而是深情的终极完成。",confidence:"极有可能",supporting:["FS-002","FS-003","FS-009","FS-013","FS-026"],contradicting:[],quote:"质本洁来还洁去，强于污淖陷渠沟。",alt:[{theory:"沉湖说",proponent:"周汝昌、俞平伯",confidence:"有可能",description:"黛玉践行'质本洁来还洁去'，于月夜投水身亡。'冷月葬花魂'为最直接的诗谶。但缺乏脂批直接支持。"},{theory:"焚稿断情说（程高本）",proponent:"程高本后四十回",confidence:"存疑",description:"黛玉在宝玉被骗娶宝钗的同一时刻焚毁诗稿，含恨而死。与脂批'万苦不怨'直接矛盾。"}]},{id:"CHAR-03",name:"薛宝钗",alias:["蘅芜君","宝姐姐"],significance:"核心",fateSummary:"嫁宝玉后'借词含讽谏'致使婚姻破裂，最终'金簪雪里埋'独守空闺",fateDetail:"贾母先黛玉而死、王夫人独揽大权后，宝钗嫁入贾府。婚后发现宝玉'空对着山中高士晶莹雪'，宝钗多次讽谏仕途经济引发冲突（脂批回目提示'薛宝钗借词含讽谏'），最终婚姻破裂。",confidence:"极有可能",supporting:["FS-007","FS-027","FS-030"],contradicting:[],quote:"好风凭借力，送我上青云。",alt:[]},{id:"CHAR-04",name:"贾元春",alias:["元妃","大小姐"],significance:"核心",fateSummary:"如杨贵妃般被赐死（非病逝），'虎兕相逢大梦归'",fateDetail:"第十八回元春点戏《乞巧》，脂批明确标注'《长生殿》伏元妃之死'——暗示元春如杨玉环死于政治斗争。判词'虎兕相逢大梦归'也指向政治冲突。元春失宠罢官，贾府失去最大政治靠山。",confidence:"确定",supporting:["FS-008","FS-017"],contradicting:[],quote:"虎兕相逢大梦归。",alt:[]},{id:"CHAR-05",name:"贾探春",alias:["蕉下客","三姑娘","玫瑰花"],significance:"核心",fateSummary:"远嫁海外为王妃，'千里东风一梦遥'",fateDetail:"探春在抄检大观园时预言'从家里自杀自灭起来才能一败涂地'，展现政治远见。判词配画（大海、大船、掩面女子）、风筝谜'游丝一断浑无力'、抽花签'必得贵婿'均指向远嫁海外。",confidence:"极有可能",supporting:["FS-006","FS-021"],contradicting:[],quote:"才自精明志自高，生于末世运偏消。",alt:[]},{id:"CHAR-06",name:"史湘云",alias:["枕霞旧友","云儿"],significance:"核心",fateSummary:"嫁卫若兰后丈夫死难，流落江湖，'湘江水逝楚云飞'",fateDetail:"脂批指明后数十回若兰在射圃所佩之金麒麟正是湘云所拾之物，证实湘云嫁卫若兰。但'白首双星'暗示夫妻分离。",confidence:"极有可能",supporting:["FS-020","FS-028"],contradicting:[],quote:"湘江水逝楚云飞。",alt:[{theory:"湘云嫁宝玉",proponent:"周汝昌、梁归智",confidence:"有可能",description:"金麒麟双配暗示宝玉湘云最终结为夫妻"}]},{id:"CHAR-07",name:"妙玉",alias:["槛外人"],significance:"核心",fateSummary:"'终陷淖泥中'——可能被强盗掳走或被迫还俗屈从权贵",fateDetail:"判词'可怜金玉质，终陷淖泥中'直接预示妙玉最终玷污。靖藏本脂批提到妙玉'流落瓜洲渡口，红颜屈从枯骨'。",confidence:"极有可能",supporting:[],contradicting:[],quote:"可怜金玉质，终陷淖泥中。",alt:[]},{id:"CHAR-08",name:"贾迎春",alias:["菱洲","二木头"],significance:"核心",fateSummary:"嫁中山狼孙绍祖，一年内被虐待致死",fateDetail:"前80回已写到迎春出嫁及回门哭诉孙绍祖'一味好色，好赌酗酒'。判词'一载赴黄粱'明确提示婚后一年即死。",confidence:"确定",supporting:["FS-019"],contradicting:[],quote:"金闺花柳质，一载赴黄粱。",alt:[]},{id:"CHAR-09",name:"贾惜春",alias:["藕榭","四姑娘"],significance:"核心",fateSummary:"勘破三春结局后出家为尼，'独卧青灯古佛旁'",fateDetail:"惜春自幼有出家倾向（第七回即说'剃了头当姑子去'，脂批称'闲闲一笔，却将后半部线索提动'）。目睹三个姐姐悲剧后看破红尘。",confidence:"确定",supporting:["FS-010"],contradicting:[],quote:"勘破三春景不长，缁衣顿改昔年妆。",alt:[]},{id:"CHAR-10",name:"王熙凤",alias:["凤辣子","凤哥","琏二奶奶"],significance:"核心",fateSummary:"'哭向金陵事更哀'——失势被休，沦为仆役扫雪，最终'雌凤'陨落惨死",fateDetail:"凤姐的命运转折极为剧烈：贾母死后失去庇护→被休→从管家奶奶沦为最下等仆役（'扫雪拾玉'暗示）→身患血崩症→死于雪地。",confidence:"极有可能",supporting:["FS-012","FS-016","FS-022"],contradicting:[],quote:"机关算尽太聪明，反算了卿卿性命。",alt:[]},{id:"CHAR-11",name:"巧姐",alias:["大姐儿"],significance:"核心",fateSummary:"被'狠舅奸兄'卖入妓院，经刘姥姥搭救赎出，嫁板儿为农家妇",fateDetail:"贾府败落后巧姐被卖入烟花巷。刘姥姥践行凤姐当年托付，倾家荡产将其赎出。最终嫁板儿为农妇，正应'偶因济刘氏，巧得遇恩人'。",confidence:"确定",supporting:["FS-004","FS-014","FS-015"],contradicting:[],quote:"偶因济刘氏，巧得遇恩人。",alt:[]},{id:"CHAR-12",name:"李纨",alias:["稻香老农","珠大嫂子"],significance:"核心",fateSummary:"贾兰科举成名、爵禄高登，但李纨自己'昏惨惨黄泉路近'不久即死",fateDetail:"判词'桃李春风结子完'暗示李纨在贾兰功成名就之际去世。她一生守寡抚孤，最终'枉与他人作笑谈'——儿子的成功自己无福享受。",confidence:"极有可能",supporting:[],contradicting:[],quote:"如冰水好空相妒，枉与他人作笑谈。",alt:[]},{id:"CHAR-13",name:"秦可卿",alias:["蓉大奶奶","兼美"],significance:"重要",fateSummary:"原稿'淫丧天香楼'，脂砚斋命删改为'死封龙禁尉'（病逝）",fateDetail:"脂批明确透露：原稿第十三回回目为'秦可卿淫丧天香楼'，作者用史笔。因可卿临终托梦有功于贾府，脂砚命芹溪删去。",confidence:"确定",supporting:["FS-011"],contradicting:[],quote:"情天情海幻情身，情既相逢必主淫。",alt:[]},{id:"CHAR-14",name:"香菱",alias:["甄英莲","秋菱"],significance:"重要",fateSummary:"被夏金桂折磨致死，'自从两地生孤木，致使香魂返故乡'",fateDetail:"判词中'两地生孤木'合为'桂'字，明确提示香菱死于夏金桂之手。",confidence:"确定",supporting:["FS-023"],contradicting:[],quote:"根并荷花一茎香，平生遭际实堪伤。",alt:[]},{id:"CHAR-15",name:"晴雯",alias:["勇晴雯"],significance:"重要",fateSummary:"被王夫人逐出大观园后抱屈夭亡（前80回已完成）",fateDetail:"晴雯之死在前80回内已完成（第七十七回）。宝玉写《芙蓉诔》'虽诔晴雯，实乃诔黛玉'（脂批提示）——她是黛玉悲剧的预演。",confidence:"确定",supporting:["FS-025"],contradicting:[],quote:"霁月难逢，彩云易散。心比天高，身为下贱。",alt:[]},{id:"CHAR-16",name:"袭人",alias:["花珍珠","花袭人"],significance:"重要",fateSummary:"嫁蒋玉菡，'堪羡优伶有福，谁知公子无缘'",fateDetail:"判词已明确袭人最终嫁给蒋玉菡（琪官）。第二十八回宝玉与蒋玉菡互换汗巾，又通过宝玉之手系在袭人腰间——伏千里姻缘。",confidence:"确定",supporting:[],contradicting:[],quote:"枉自温柔和顺，空云似桂如兰。",alt:[]},{id:"CHAR-17",name:"刘姥姥",alias:["刘老老"],significance:"次要",fateSummary:"三进荣国府时倾家荡产搭救巧姐，成为'遇难成祥'的恩人",fateDetail:"刘姥姥是全书的结构性人物——一进求告、二进游览、三进时贾府已败，她散尽家财赎回巧姐。",confidence:"确定",supporting:["FS-014","FS-015"],contradicting:[],quote:"得意浓时易接济，受恩深处胜亲朋。",alt:[]},{id:"CHAR-18",name:"柳湘莲",alias:["冷二郎","冷面郎君"],significance:"次要",fateSummary:"因尤三姐自刎看破红尘，可能'作强梁'（沦为强盗）",fateDetail:"柳湘莲在尤三姐死后被道士点破出家。但第一回《好了歌》注中提到'训有方，保不定日后作强梁'——甲戌本脂批明确批注'柳湘莲一干人'。",confidence:"极有可能",supporting:[],contradicting:[],quote:"训有方，保不定日后作强梁。",alt:[]},{id:"CHAR-19",name:"鸳鸯",alias:["金鸳鸯"],significance:"重要",fateSummary:"贾母死后失去庇护，为抗拒贾赦霸占而自尽——'殉主'或殉己",fateDetail:"贾母一死，贾赦必然报复。以鸳鸯的刚烈性格，不会屈从。死亡方式：上吊自杀（最可能的'殉主'方式）。",confidence:"极有可能",supporting:["FS-036","FS-049"],contradicting:[],quote:"我是横了心的，当着众人在这里，我这一辈子莫说是'宝玉'，便是'宝金''宝银''宝天王''宝皇帝'，横竖不嫁人就完了！",alt:[]},{id:"CHAR-20",name:"平儿",alias:["平姑娘"],significance:"重要",fateSummary:"凤姐死后被贾琏扶正——从通房丫鬟变成正妻",fateDetail:"凤姐被休/死后，贾琏极有可能将平儿扶正——平儿是凤姐的陪房丫鬟，本身是贾琏的通房。",confidence:"有可能",supporting:[],contradicting:[],alt:[]},{id:"CHAR-21",name:"紫鹃",alias:["鹦哥"],significance:"重要",fateSummary:"黛玉死后，紫鹃的结局悬而未决——可能随惜春出家或留在贾府继续伺候",fateDetail:"黛玉死后紫鹃失去了存在意义。'鹃'即杜鹃——'杜鹃啼血'——紫鹃的命运可能比主人更凄惨。",confidence:"存疑",supporting:[],contradicting:[ var FORESHADOWINGS=[{id:"FS-001",chapter:1,type:"文本伏笔",content:"因空见色，由色生情，传情入色，自色悟空",context:"开卷第一回即点明宝玉一生轨迹：空空→见色→生情→悟空。十六字总纲预示宝玉最终'悬崖撒手'出家。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[{id:"EVT-001",name:"宝玉出家"}],source:"甲戌本第一回"},{id:"FS-002",chapter:1,type:"文本伏笔",content:"绛珠仙草：'他既下世为人，我也去下世为人，但把我一生所有的眼泪还他，也偿还得过他了。'",context:"木石前盟的神话框架。黛玉下世即为'还泪'——当泪尽之时便是归天之日。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-02",name:"林黛玉"},{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[{id:"EVT-002",name:"黛玉泪尽夭亡"}],source:"甲戌本第一回"},{id:"FS-003",chapter:5,type:"谶语判词",content:"黛玉判词：'玉带林中挂'；判曲《枉凝眉》：'若说没奇缘，今生偏又遇着他；若说有奇缘，如何心事终虚化？'",context:"判词和判曲明确预示宝黛爱情以悲剧告终。'心事终虚化'——一切情感最终成空。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-02",name:"林黛玉"},{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[{id:"EVT-002",name:"黛玉泪尽夭亡"}],source:"第五回"},{id:"FS-004",chapter:5,type:"谶语判词",content:"巧姐判词：'偶因济刘氏，巧得遇恩人。'配画：一座荒村野店，有一美人在那里纺绩。",context:"判词明确：贾府败落后巧姐落难，因凤姐当年接济刘姥姥的善缘，被刘氏救出，嫁为农妇。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-11",name:"巧姐"},{id:"CHAR-17",name:"刘姥姥"}],relatedEvents:[{id:"EVT-004",name:"刘姥姥救巧姐"}],source:"第五回"},{id:"FS-005",chapter:5,type:"谶语判词",content:"宝玉判曲《终身误》：'都道是金玉良姻，俺只念木石前盟。空对着，山中高士晶莹雪；终不忘，世外仙姝寂寞林。'",context:"明确宝玉婚后状态：已经娶了宝钗（'空对着'），但心中始终不忘黛玉。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"},{id:"CHAR-03",name:"薛宝钗"},{id:"CHAR-02",name:"林黛玉"}],relatedEvents:[],source:"第五回"},{id:"FS-006",chapter:5,type:"谶语判词",content:"探春判词：'清明涕送江边望，千里东风一梦遥。'配画：两人放风筝，一片大海，一只大船。",context:"配画细节指向探春远嫁海外。风筝喻意'游丝一断浑无力'——断了线的风筝再也回不来。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-05",name:"贾探春"}],relatedEvents:[{id:"EVT-006",name:"探春远嫁海外"}],source:"第五回"},{id:"FS-007",chapter:5,type:"谶语判词",content:"宝钗判词：'金簪雪里埋'。判曲《终身误》中称其'山中高士晶莹雪'。",context:"'金簪雪里埋'暗示宝钗最终埋没/死于雪中，与'山中高士'的高洁孤独形象一致。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-03",name:"薛宝钗"}],relatedEvents:[],source:"第五回"},{id:"FS-008",chapter:5,type:"谶语判词",content:"元春判词：'虎兕相逢大梦归'。配画'一张弓，弓上挂一香橼'——弓为兵器，香橼谐'元'。",context:"'虎兕相逢'是两强猛兽相遇，暗示元春死于残酷的政治斗争而非善终。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-04",name:"贾元春"}],relatedEvents:[{id:"EVT-007",name:"元春被赐死"}],source:"第五回"},{id:"FS-009",chapter:76,type:"文本伏笔",content:"黛玉与湘云在凹晶馆联诗，黛玉出'冷月葬花魂'",context:"此句是全书最为阴冷的谶语之一。中秋圆月之下，黛玉脱口而出'死'字（'葬'即埋葬）。如果'花魂'是对的，则直接预言黛玉葬身水中。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-02",name:"林黛玉"}],relatedEvents:[{id:"EVT-002",name:"黛玉泪尽夭亡"}],source:"第七十六回"},{id:"FS-010",chapter:7,type:"文本伏笔",content:"惜春笑道：'我这里正和智能儿说，我明儿也剃了头同他作姑子去呢。'脂批：'闲闲一笔，却将后半部线索提动。'",context:"惜春幼年一句玩笑话成为日后出家的谶语。脂批确认此为后文伏线。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-09",name:"贾惜春"}],relatedEvents:[{id:"EVT-008",name:"惜春出家为尼"}],source:"第七回，甲戌本脂批"},{id:"FS-011",chapter:13,type:"脂批批语",content:"甲戌本回前总批：'秦可卿淫丧天香楼，作者用史笔也。'回末批：'此回只十页，因删去天香楼一节，少却四五页也。'",context:"脂砚斋明确说原稿中秦可卿不是病死而是'淫丧'——在天香楼自缢而死。因可卿临终托梦有功，脂砚命作者删去。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-13",name:"秦可卿"}],relatedEvents:[],source:"第十三回，甲戌本脂批"},{id:"FS-012",chapter:23,type:"脂批批语",content:"脂批：'……凤姐扫雪拾玉……'",context:"此条脂批揭示凤姐在后文中沦落到在雪地中扫雪，并发现了宝玉丢失的玉。凤姐从管家奶奶沦为最低等的仆役。",evidenceType:"脂批直接提示",confidence:"极有可能",relatedCharacters:[{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[],source:"第二十三回脂批"},{id:"FS-013",chapter:78,type:"脂批批语",content:"脂批在《芙蓉女儿诔》处批：'虽诔晴雯，实乃诔黛玉也。'",context:"这条脂批是最重要的伏笔之一——宝玉悼晴雯的《芙蓉诔》，在深层结构上是预先为黛玉写的悼文。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-02",name:"林黛玉"},{id:"CHAR-15",name:"晴雯"}],relatedEvents:[{id:"EVT-002",name:"黛玉泪尽夭亡"}],source:"第七十八回，脂批"},{id:"FS-014",chapter:6,type:"脂批批语",content:"脂批：'略有些瓜葛，是数十回后之正脉也。'",context:"刘姥姥初进贾府时脂批就点明：眼前这微小的'瓜葛'，却是后文的'正脉'——即刘姥姥与贾府命运最深的关联。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-17",name:"刘姥姥"},{id:"CHAR-11",name:"巧姐"}],relatedEvents:[{id:"EVT-004",name:"刘姥姥救巧姐"}],source:"第六回，甲戌本脂批"},{id:"FS-015",chapter:41,type:"文本伏笔",content:"板儿与巧姐互换佛手与柚子。脂批称：'小儿常情，遂成千里伏线。'又批：'佛手者，正指迷津者也。'",context:"两个小孩交换玩具——佛手（指引迷津者）与柚子（团圆的缘）——在脂砚斋看来不是闲笔，而是巧姐与板儿日后姻缘的最早暗示。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-11",name:"巧姐"}],relatedEvents:[{id:"EVT-004",name:"刘姥姥救巧姐"}],source:"第四十一回，庚辰本脂批"},{id:"FS-016",chapter:5,type:"谶语判词",content:"凤姐判词：'一从二令三人木，哭向金陵事更哀。'配画：一片冰山，上面有一只雌凤。",context:"'一从二令三人木'中'三人木'拆字为'休'，暗示凤姐先顺从、后发号施令、最终被贾琏休弃。冰山消融则雌凤坠水。",evidenceType:"判词/谶语",confidence:"极有可能",relatedCharacters:[{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[],source:"第五回"},{id:"FS-017",chapter:18,type:"脂批批语",content:"元妃点四出戏。第一出《豪宴》（脂批：'《一捧雪》伏贾家之败'），第二出《乞巧》（脂批：'《长生殿》伏元妃之死'），第三出《仙缘》（脂批：'《邯郸梦》伏甄宝玉送玉'），第四出《离魂》（脂批：'《牡丹亭》伏黛玉死'）",context:"这是脂批中最系统、最重要的四条戏谶。四出戏依次预告了贾府的四大核心事件：家败→元妃死→甄宝玉送玉→黛玉死。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-04",name:"贾元春"},{id:"CHAR-02",name:"林黛玉"},{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[{id:"EVT-007",name:"元春被赐死"},{id:"EVT-002",name:"黛玉泪尽夭亡"},{id:"EVT-013",name:"贾府被抄"}],source:"第十八回，庚辰本脂批"},{id:"FS-018",chapter:30,type:"对话暗示",content:"黛玉道：'你死了，我做和尚。'宝玉道：'你死了，我做和尚去。'",context:"宝玉反复说自己会'做和尚'——这看似情侣间的日常对话，实为全书最重大的谶语之一。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"},{id:"CHAR-02",name:"林黛玉"}],relatedEvents:[{id:"EVT-001",name:"宝玉出家"}],source:"第三十回"},{id:"FS-019",chapter:5,type:"谶语判词",content:"迎春判词：'子系中山狼，得志便猖狂。金闺花柳质，一载赴黄粱。'",context:"'子系'合为孙（孫），指孙绍祖。'一载赴黄粱'——嫁后一年即死。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-08",name:"贾迎春"}],relatedEvents:[],source:"第五回"},{id:"FS-020",chapter:31,type:"文本伏笔",content:"湘云与丫鬟翠缕论阴阳时，在蔷薇架下捡到一个金麒麟。回目本身即为'因麒麟伏白首双星'。",context:"回目中'伏白首双星'是关键——金麒麟配对伏下白首姻缘。脂批透露后文中卫若兰在射圃佩戴此麒麟。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-06",name:"史湘云"}],relatedEvents:[],source:"第三十一回"},{id:"FS-021",chapter:22,type:"谶语判词",content:"探春所作风筝灯谜：'游丝一断浑无力，莫向东风怨别离。'庚辰本批：此探春远适之谶也。",context:"断线的风筝即远嫁海外、永不归来的探春。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-05",name:"贾探春"}],relatedEvents:[{id:"EVT-006",name:"探春远嫁海外"}],source:"第二十二回，庚辰本批语"},{id:"FS-022",chapter:43,type:"文本伏笔",content:"尤氏对凤姐说：'你瞧瞧，把他幸的这个样儿！我劝你收着些儿好，太满了就泼出来了。'",context:"这一句看似随口的警告，暗合全书'月满则亏，水满则溢'的哲理。",evidenceType:"前80回文本伏笔",confidence:"有可能",relatedCharacters:[{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[],source:"第四十三回"},{id:"FS-023",chapter:5,type:"谶语判词",content:"香菱判词：'自从两地生孤木，致使香魂返故乡。'",context:"'两地'为两个'土'字，'孤木'为一个'木'字——合为'桂'。夏金桂的出现导致香菱之死。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-14",name:"香菱"}],relatedEvents:[{id:"EVT-017",name:"香菱被夏金桂折磨致死"}],source:"第五回"},{id:"FS-024",chapter:21,type:"脂批批语",content:"庚辰本回前总批提到后文回目：'薛宝钗借词含讽谏，王熙凤知命强英雄'",context:"这条脂批提供了后三十回的两个关键回目，证实宝钗婚后劝谏宝玉导致婚姻破裂，以及凤姐失势后的挣扎。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-03",name:"薛宝钗"},{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[],source:"第二十一回，庚辰本回前总批"},{id:"FS-025",chapter:5,type:"谶语判词",content:"晴雯判词：'霁月难逢，彩云易散。心比天高，身为下贱。'",context:"晴雯判词已完全揭示其在前80回内的结局——被王夫人以谣言毁谤逐出后夭亡。她的死是'千红一哭'的预演。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-15",name:"晴雯"},{id:"CHAR-02",name:"林黛玉"}],relatedEvents:[],source:"第五回"},{id:"FS-026",chapter:27,type:"文本伏笔",content:"《葬花吟》：'一年三百六十日，风刀霜剑严相逼。……质本洁来还洁去，强于污淖陷渠沟。……花落人亡两不知！'",context:"整首葬花吟就是黛玉对自己命运的讖言。'花落人亡两不知'——到死都不知道。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-02",name:"林黛玉"}],relatedEvents:[{id:"EVT-002",name:"黛玉泪尽夭亡"}],source:"第二十七回"},{id:"FS-027",chapter:63,type:"谶语判词",content:"宝钗抽牡丹花签：'任是无情也动人'，签注'此为群芳之冠'",context:"花签游戏中宝钗抽得'群芳之冠'牡丹——她确实做了宝玉的正妻，是名义上的'冠'。但'任是无情也动人'暗示她虽完美却无情。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-03",name:"薛宝钗"}],relatedEvents:[],source:"第六十三回"},{id:"FS-028",chapter:63,type:"谶语判词",content:"湘云抽海棠花签：'只恐夜深花睡去'。暗合第六十二回湘云醉卧芍药裀（石上入睡）。",context:"海棠花签预示春睡易醒——美好时光短暂，与湘云的短暂婚姻形成呼应。",evidenceType:"前80回文本伏笔",confidence:"有可能",relatedCharacters:[{id:"CHAR-06",name:"史湘云"}],relatedEvents:[],source:"第六十三回"},{id:"FS-029",chapter:25,type:"文本伏笔",content:"癞头和尚持通灵宝玉说道：'青埂峰一别，展眼已过十三载矣！人世光阴，如此迅速，尘缘满日，若似弹指！'",context:"'尘缘满日，若似弹指'——暗示通灵玉在凡间的期限，也是宝玉在人世的期限。玉最终被送回青埂峰。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[{id:"EVT-001",name:"宝玉出家"}],source:"第二十五回"},{id:"FS-030",chapter:22,type:"谶语判词",content:"宝钗所作灯谜：'梧桐叶落分离别，恩爱夫妻不到冬。'庚辰本批：此宝钗之谶也。",context:"'恩爱夫妻不到冬'——宝钗与宝玉的婚姻极其短暂，不到一年即分离。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-03",name:"薛宝钗"},{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[],source:"第二十二回，庚辰本批语"},{id:"FS-031",chapter:5,type:"谶语判词",content:"《飞鸟各投林》：'好一似食尽鸟投林，落了片白茫茫大地真干净！'",context:"全书谶语的总归纳。否定了一切'沐皇恩''兰桂齐芳'的好结局——全书必须以绝对悲剧收场。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"},{id:"CHAR-09",name:"贾惜春"},{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[{id:"EVT-001",name:"宝玉出家"},{id:"EVT-013",name:"贾府被抄"}],source:"第五回"},{id:"FS-032",chapter:1,type:"文本伏笔",content:"甄士隐解《好了歌》：'因嫌纱帽小，致使锁枷扛'",context:"直接预言贾雨村等人因贪恋权位入狱。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[{id:"EVT-001",name:"宝玉出家"},{id:"EVT-013",name:"贾府被抄"}],source:"第一回"},{id:"FS-033",chapter:63,type:"谶语判词",content:"麝月抽到荼蘼花签：'开到荼蘼花事了'，签注'在席各饮三杯送春'。宝玉看了皱眉头，藏了起来。",context:"荼蘼是春天最后一种花，'开到荼蘼花事了'意味着大观园的繁华到此终结。麝月是怡红院最后一个丫鬟。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-15",name:"晴雯"}],relatedEvents:[],source:"第六十三回"},{id:"FS-034",chapter:8,type:"文本伏笔",content:"宝钗的金锁上錾着'不离不弃，芳龄永继'八个字，与宝玉的通灵玉'莫失莫忘，仙寿恒昌'恰成一对。",context:"'金玉良缘'的神话框架。金锁的'芳龄永继'——永继即永远继续，暗示宝钗会活得比宝玉久、孤独终老。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-03",name:"薛宝钗"},{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[],source:"第八回"},{id:"FS-035",chapter:5,type:"谶语判词",content:"袭人判词：'枉自温柔和顺，空云似桂如兰。堪羡优伶有福，谁知公子无缘。'",context:"袭人最终未能如愿嫁给宝玉，而是嫁给了蒋玉菡。'公子无缘'直白至极。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-16",name:"袭人"}],relatedEvents:[],source:"第五回"},{id:"FS-036",chapter:46,type:"人物性格逻辑",content:"贾赦要鸳鸯为妾，鸳鸯剪发誓绝。贾赦威胁：'凭他嫁到谁家去，也难出我的手心。'",context:"鸳鸯在贾母死后的处境十分危险。贾母一死，贾赦必定报复。按人物性格逻辑——鸳鸯的刚烈决定了她不会屈服于贾赦。",evidenceType:"人物性格逻辑",confidence:"极有可能",relatedCharacters:[],relatedEvents:[],source:"第四十六回 + 人物性格推理"},{id:"FS-038",chapter:39,type:"文本伏笔",content:"刘姥姥讲了一个'雪地里抽柴草'的故事：有个十七八岁的极标致的小姑娘叫茗玉，父亲无子，老两口视如珍宝。茗玉长到十七岁一病死了。",context:"'茗玉'就是'黛玉'的翻版——都是若玉/黛玉，都'十七岁一病死了'。蔡义江解读为曹雪芹暗示黛玉的真正结局——十七岁病逝。",evidenceType:"文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-02",name:"林黛玉"},{id:"CHAR-17",name:"刘姥姥"}],relatedEvents:[{id:"EVT-002",name:"黛玉泪尽夭亡"}],source:"第三十九回 + 蔡义江解读"},{id:"FS-039",chapter:77,type:"文本伏笔",content:"王夫人抄检怡红院，逐出晴雯、四儿、芳官等。宝玉不敢言。",context:"这次清洗是贾府内部'自杀自灭'的预演。晴雯之死=小规模悲剧预演，抄检大观园=规模扩大，贾府被抄=最终灾难。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-15",name:"晴雯"},{id:"CHAR-01",name:"贾宝玉"},{id:"CHAR-05",name:"贾探春"}],relatedEvents:[{id:"EVT-013",name:"贾府被抄"}],source:"第七十七回"},{id:"FS-040",chapter:8,type:"脂批批语",content:"脂批：'茜雪至狱神庙方呈正文。'畸笏批：'狱神庙回有茜雪、红玉一大回文字。'",context:"茜雪在前八十回中只是一个因'枫露茶'被撵的无名丫鬟。但脂砚斋暗示她的'正文'不在前80回——而在狱神庙。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[],source:"第八回脂批+畸笏批"},{id:"FS-041",chapter:24,type:"脂批批语",content:"脂批：'此人（贾芸）后来荣府事败，必有一番作为。'",context:"贾芸将在后文仗义援手。与小红结婚后，通过醉金刚倪二的人脉关系在狱中打点，设法营救宝玉凤姐。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-10",name:"王熙凤"},{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[],source:"第二十四回脂批+畸笏批"},{id:"FS-043",chapter:49,type:"文本伏笔",content:"贾母见了薛宝琴，'喜欢的无可不可'，立即逼着王夫人认作干女儿。又细问宝琴的年庚八字。",context:"贾母对宝琴的极度偏爱间接说明贾母从未考虑过宝钗——否定了'贾母支持金玉良缘'的通俗说法。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-03",name:"薛宝钗"},{id:"CHAR-02",name:"林黛玉"}],relatedEvents:[],source:"第四十九回+第五十回"},{id:"FS-044",chapter:40,type:"文本伏笔",content:"贾母向薛姨妈等人展示'软烟罗'：'如今上用的府纱也没有这样软厚轻密的了。'",context:"软烟罗这种'比上用还好'的织物暗示贾府鼎盛时期曾拥有超越皇家的奢华——这本身就是取祸之道（'僭越'是清代的重罪）。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[{id:"EVT-013",name:"贾府被抄"}],source:"第四十回"},{id:"FS-045",chapter:75,type:"文本伏笔",content:"贾珍等人在宁国府宴饮赌博，忽闻贾府祠堂那边墙下有人长叹之声。众人毛发倒竖，但继续玩乐。",context:"祖灵长叹是全书中阴气最重的场景之一——贾府的祖宗已经'看不下去'了。'长叹'而非'怒吼'——祖宗已经放弃了。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[],relatedEvents:[{id:"EVT-013",name:"贾府被抄"}],source:"第七十五回"},{id:"FS-046",chapter:74,type:"文本伏笔",content:"探春：'你们别忙，自然连你们抄的日子有呢！……可知这样大族人家，若从外头杀来，一时是杀不死的……必须先从家里自杀自灭起来，才能一败涂地！'",context:"探春的这段慷慨陈词是全书中政治眼光最高的言论。她看到了本质——贾府之败不是外力击倒，而是内部先烂。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-05",name:"贾探春"}],relatedEvents:[{id:"EVT-013",name:"贾府被抄"}],source:"第七十四回"},{id:"FS-047",chapter:5,type:"谶语判词",content:"李纨判词后段：'气昂昂头戴簪缨，光灿灿胸悬金印，威赫赫爵禄高登——昏惨惨黄泉路近！'",context:"这些词描写的是一位'爵禄高登'者——就是贾兰。他科举成功、做官显赫。但'昏惨惨黄泉路近'——成功之后立即死亡。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-12",name:"李纨"}],relatedEvents:[],source:"第五回"},{id:"FS-048",chapter:28,type:"脂批批语",content:"宝玉与蒋玉菡互换汗巾。晚上宝玉将大红汗巾系在袭人腰间。脂批：此物伏袭人后文嫁与蒋玉菡。",context:"汗巾交换伏下袭人嫁给蒋玉菡——宝玉的两条汗巾做了'媒'。",evidenceType:"脂批直接提示",confidence:"确定",relatedCharacters:[{id:"CHAR-16",name:"袭人"},{id:"CHAR-01",name:"贾宝玉"}],relatedEvents:[],source:"第二十八回+脂批"},{id:"FS-049",chapter:46,type:"人物性格逻辑",content:"鸳鸯发誓宁可剪头发做姑子或自尽，绝不从贾赦。贾母死后贾赦必然报复。",context:"鸳鸯前80回未死，但按照人物性格逻辑（刚烈不折），贾母死后她必然以某种方式自尽。",evidenceType:"人物性格逻辑",confidence:"极有可能",relatedCharacters:[],relatedEvents:[],source:"第四十六回+人物性格推理"},{id:"FS-051",chapter:71,type:"文本伏笔",content:"邢夫人当着众人面向凤姐'求情'放了两个被扣的老婆子，凤姐羞得脸紫胀。贾母的庇护使凤姐暂时稳住。",context:"这是凤姐权威第一次受到公开挑战。贾母死后邢夫人的报复只会更猛烈。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[],source:"第七十一回"},{id:"FS-052",chapter:2,type:"文本伏笔",content:"冷子兴：'如今外面的架子虽未甚倒，内囊却也尽上来了。……如今的儿孙，竟一代不如一代了！'",context:"冷子兴在全书第二回已给出了贾府的诊断：1)财政亏空。2)人才凋零。两把刀同时砍向贾府。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[],relatedEvents:[{id:"EVT-013",name:"贾府被抄"}],source:"第二回"},{id:"FS-054",chapter:66,type:"文本伏笔",content:"尤三姐在柳湘莲退婚后自刎。柳湘莲被跛足道人点破，'将万根烦恼丝一挥而尽'，随之出家而去。",context:"柳湘莲的出家方式——'冷入空门'——是对宝玉出家的明确预演。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-01",name:"贾宝玉"},{id:"CHAR-18",name:"柳湘莲"}],relatedEvents:[{id:"EVT-001",name:"宝玉出家"}],source:"第六十六回"},{id:"FS-055",chapter:13,type:"文本伏笔",content:"秦可卿托梦凤姐：'常言月满则亏，水满则溢。……但如今能于荣时筹画下将来衰时的世业，亦可谓常保永全了。'建议在祖茔附近多置田庄。",context:"可卿托梦是全书中最重要的'如果有人听了，结局会怎样'的假设。凤姐醒来后并未照办——这暗示凤姐的致命弱点：她不善于长远规划。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-13",name:"秦可卿"},{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[{id:"EVT-013",name:"贾府被抄"}],source:"第十三回"},{id:"FS-056",chapter:7,type:"文本伏笔",content:"焦大醉骂：'每日偷狗戏鸡，爬灰的爬灰，养小叔子的养小叔子，我什么不知道？'",context:"'爬灰'指公公与儿媳乱伦——公认指贾珍与秦可卿。焦大是宁国府的老人——他的骂揭露了贾府道德崩溃的根底。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-13",name:"秦可卿"}],relatedEvents:[],source:"第七回"},{id:"FS-057",chapter:5,type:"谶语判词",content:"妙玉判曲《世难容》：'到头来依旧是风尘肮脏违心愿。好一似无瑕白玉遭泥陷，又何须王孙公子叹无缘。'",context:"妙玉判曲的核心是'风尘肮脏违心愿'——从至洁堕入至污。靖藏本脂批提到妙玉'流落瓜洲渡口，红颜屈从枯骨'。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-07",name:"妙玉"}],relatedEvents:[],source:"第五回"},{id:"FS-058",chapter:5,type:"谶语判词",content:"凤姐判曲《聪明累》：'机关算尽太聪明，反算了卿卿性命。……忽喇喇如大厦倾，昏惨惨似灯将尽。'",context:"整首判曲是对凤姐一生最完整的预言。'忽喇喇如大厦倾'——贾府之败的瞬间性和彻底性。",evidenceType:"判词/谶语",confidence:"确定",relatedCharacters:[{id:"CHAR-10",name:"王熙凤"}],relatedEvents:[{id:"EVT-013",name:"贾府被抄"}],source:"第五回"},{id:"FS-059",chapter:62,type:"文本伏笔",content:"湘云吃醉了酒，在山子后头一块青石板凳上睡着了，'四面芍药花飞了一身，满头脸衣襟上皆是红香散乱'。",context:"'醉眠'是湘云命运的隐喻——美好的事物注定短暂。'芍药'在古典文学中寓意为'别离'。花瓣覆盖了她的全身——暗示湘云将被'埋葬'在某种象征性的死亡中。",evidenceType:"前80回文本伏笔",confidence:"极有可能",relatedCharacters:[{id:"CHAR-06",name:"史湘云"}],relatedEvents:[],source:"第六十二回"},{id:"FS-060",chapter:79,type:"文本伏笔",content:"夏金桂嫁入薛家后立即开始折磨香菱，给她改名为'秋菱'。香菱'自前儿又病了二十多天，血分中有病'。",context:"香菱的悲剧在前80回末尾已经全面开启。'秋菱'谐音'秋零'——秋天的凋零。薛家的崩溃是四大家族中第一个完成的。",evidenceType:"前80回文本伏笔",confidence:"确定",relatedCharacters:[{id:"CHAR-14",name:"香菱"}],relatedEvents:[{id:"EVT-017",name:"香菱被夏金桂折磨致死"}],source:"第七十九回-第八十回"}];

  h+='约1745 · 迁居西山，\'不如著书黄叶村\'，全力写作《红楼梦》<br>';
  h+='约1754 · 脂砚斋开始抄阅再评《石头记》，初稿已基本完成<br>';
  h+='1763   · 幼子夭折，感伤成疾，除夕病逝。脂批：\'书未成，芹为泪尽而逝\'</div>';
  h+='<p style="font-size:13px;color:var(--t2);margin-top:4px">来源：敦诚《四松堂集》、敦敏《懋斋诗钞》、脂批、冯其庸《曹雪芹家世新考》等</p></div></div>';

  // ===== 曹雪芹的"其他作品" =====
  h+='<div class="card"><div class="card-title">📜 曹雪芹的其他传世作品</div><div class="card-body">';
  h+='<p style="margin-bottom:8px">曹雪芹除《红楼梦》外，诗文作品传世极少——因为他晚年贫困，作品散佚严重。已知可考的仅有两句存诗和有限的友朋记载。</p>';

  h+='<div style="background:var(--al);padding:12px 14px;border-radius:6px;margin-bottom:10px">';
  h+='<div style="font-weight:700;font-size:15px;margin-bottom:4px">🖌️ 题敦诚《琵琶行传奇》残句</div>';
  h+='<div style="font-size:16px;font-style:italic;color:var(--accent);padding:6px 0;text-align:center">"白傅诗灵应喜甚，定教蛮素鬼排场"</div>';
  h+='<p style="font-size:13px;color:var(--t2);margin-top:4px"><b>背景：</b>敦诚作《琵琶行传奇》一折后，曹雪芹为之题诗。此诗仅存最后两句，是敦诚在《四松堂诗钞》中记录的。这是曹雪芹除《红楼梦》外唯一传世的文学作品。</p>';
  h+='<p style="font-size:13px;color:var(--t2);margin-top:4px"><b>解读：</b>周汝昌称此句"奇气逼人"。诗句化用白居易《琵琶行》典故——"白傅"即白居易，"蛮素"即白居易的家妓小蛮和樊素。曹雪芹说白居易看到这出戏会"喜甚"并命家妓排演——这是曹氏特有的<strong>跌宕戏谑之笔</strong>，与《红楼梦》中"假作真时真亦假"的幽默一脉相承。</p></div>';

  h+='<div style="background:var(--al);padding:12px 14px;border-radius:6px;margin-bottom:10px">';
  h+='<div style="font-weight:700;font-size:15px;margin-bottom:4px">🖌️ 自题画石诗</div>';
  h+='<div style="font-size:16px;font-style:italic;color:var(--accent);padding:6px 0;text-align:center">"爱此一拳石，玲珑出自然。<br>溯源应太古，堕世又何年。<br>有志归完璞，无才去补天。<br>不求邀众赏，潇洒做顽仙。"</div>';
  h+='<p style="font-size:13px;color:var(--t2);margin-top:4px"><b>背景：</b>此诗据传出自敦敏《懋斋诗钞》所附曹雪芹遗诗，但真伪存在争议。吴恩裕最早提出此诗系曹雪芹所作，也有学者认为是后人伪托。</p>';
  h+='<p style="font-size:13px;color:var(--t2);margin-top:4px"><b>解读：</b>"有志归完璞，无才去补天"——与《红楼梦》第一回"无材可去补苍天"的石头自述如出一辙。<strong>如果此诗为真</strong>，则"顽仙"二字已经点明了宝玉的最终归宿（潇洒活着的"野狐禅"而非青灯古佛的枯寂）。周汝昌认为："此诗是曹雪芹全部人格和文学理想的浓缩。"</p></div>';

  h+='<div style="background:var(--al);padding:12px 14px;border-radius:6px;margin-bottom:8px">';
  h+='<div style="font-weight:700;font-size:15px;margin-bottom:4px">🎨 绘画作品</div>';
  h+='<p style="font-size:13px;line-height:1.8;color:var(--t2)">敦敏《题芹圃画石》中写道"醉余奋扫如椽笔，写出胸中磈礧时"——证明曹雪芹擅长画石，以石之嶙峋表达胸中不平之气。张宜泉也称"门外山川供绘画"。遗憾的是，曹雪芹画作全部失传，无一存世。</p>';
  h+='<p style="font-size:13px;color:var(--t2);margin-top:4px"><b>文学史评价：</b>曹雪芹的诗风被敦诚评为"有奇气，直追昌谷（李贺）"。这意味着他的诗风是奇诡、跳跃、瑰丽的——与《红楼梦》中代人物所作诗词的含蓄典雅不同。这说明曹雪芹在小说中<strong>刻意克制了自己的诗风</strong>，以符合人物性格，这是极高的创作自觉。</p></div>';

  h+='<p style="font-size:12px;color:var(--t3)">注：自题画石诗真伪存疑。周汝昌、吴恩裕持真，部分学者持伪。本项目标记为"存疑"。</p></div></div>';

  // ===== 红学名家分析 =====
  h+='<div class="card"><div class="card-title">🏛️ 古今名家论曹雪芹</div><div class="card-body">';

  // 胡适
  h+='<div style="border-bottom:1px solid var(--border);padding:10px 0">';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="conf c-high">胡适 (1891-1962)</span><span style="font-size:11px;color:var(--t3)">新红学奠基人</span></div>';
  h+='<p style="font-size:13px;color:var(--t2);padding:4px 10px;background:var(--al);border-radius:4px;font-style:italic">"《红楼梦》是曹雪芹将真事隐去的自叙，贾政即是曹頫，贾宝玉即是曹雪芹。"</p>';
  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px"><b>贡献：</b>1921年发表《红楼梦考证》，确立"自叙传"说，以考证方法取代索隐派。考证了曹雪芹家世和作者身份。局限：将小说等同于自传，忽略了小说的虚构性和文学性。</p></div>';

  // 周汝昌
  h+='<div style="border-bottom:1px solid var(--border);padding:10px 0">';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="conf c-mid">周汝昌 (1918-2012)</span><span style="font-size:11px;color:var(--t3)">考证派集大成者</span></div>';
  h+='<p style="font-size:13px;color:var(--t2);padding:4px 10px;background:var(--al);border-radius:4px;font-style:italic">"曹雪芹是中华文化的托命人，他的《红楼梦》蕴含了中华文明的一切精华。"</p>';
  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px"><b>贡献：</b>代表作《红楼梦新证》（1953），将曹学推到极致。考证了曹家家世、脂批体系。提出史湘云嫁宝玉说、曹雪芹卒年癸未说。局限：部分观点争议较大，对程高本的否定过于极端。</p></div>';

  // 俞平伯
  h+='<div style="border-bottom:1px solid var(--border);padding:10px 0">';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="conf c-high">俞平伯 (1900-1990)</span><span style="font-size:11px;color:var(--t3)">文本批评派先驱</span></div>';
  h+='<p style="font-size:13px;color:var(--t2);padding:4px 10px;background:var(--al);border-radius:4px;font-style:italic">"《红楼梦》是作者通过家庭兴衰写出的「色空」观念，非自传也非政治小说。"</p>';
  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px"><b>贡献：</b>代表作《红楼梦辨》（1922），首次系统研究后四十回真伪。提出"钗黛合一"说。晚年承认"胡适、周汝昌的考证比我重要，但我的文学分析比他们强"。与胡适分歧在于：他认为小说是文学作品，不能等同于自传。</p></div>';

  // 余英时
  h+='<div style="border-bottom:1px solid var(--border);padding:10px 0">';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="conf c-mid">余英时 (b.1930)</span><span style="font-size:11px;color:var(--t3)">海外红学泰斗</span></div>';
  h+='<p style="font-size:13px;color:var(--t2);padding:4px 10px;background:var(--al);border-radius:4px;font-style:italic">"曹雪芹创造了一个理想世界（大观园），又亲手将它粉碎——这才是《红楼梦》的真正悲剧。"</p>';
  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px"><b>贡献：</b>代表作《红楼梦的两个世界》（1974），提出"大观园是理想世界、贾府是现实世界"的二元结构。将红学从烦琐考证提升到哲学思辨的高度。他认为曹雪芹的伟大不在于忠实地记录了家世，而在于创造了一个与现实对抗的"乌托邦"。</p></div>';

  // 欧丽娟
  h+='<div style="border-bottom:1px solid var(--border);padding:10px 0">';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="conf c-mid">欧丽娟 (b.1963)</span><span style="font-size:11px;color:var(--t3)">当代红学诠释学</span></div>';
  h+='<p style="font-size:13px;color:var(--t2);padding:4px 10px;background:var(--al);border-radius:4px;font-style:italic">"曹雪芹的悲剧观是「有情之天被无情之天毁灭」——大观园是有情的象征，贾府是无情的象征。"</p>';
  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px"><b>贡献：</b>代表作《大观红楼》系列。以西方文学理论（叙事学、神话原型批评、女性主义）重新审视《红楼梦》。矫正了"以情反理"的简单解读，强调曹雪芹世界观的复杂性——他既批判儒家礼教又认同家族责任，既赞美女儿又写其局限性。</p></div>';

  // 海外学者
  h+='<div style="border-bottom:1px solid var(--border);padding:10px 0">';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="conf c-mid">史景迁 (Jonathan Spence, b.1936)</span><span style="font-size:11px;color:var(--t3)">海外汉学大家</span></div>';
  h+='<p style="font-size:13px;color:var(--t2);padding:4px 10px;background:var(--al);border-radius:4px;font-style:italic">"曹寅（曹雪芹祖父）的文化世界——刻《全唐诗》、结交江南文人、四次接驾——是《红楼梦》中那个贵族世界的真实底色。"</p>';
  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px"><b>贡献：</b>代表作《曹寅与康熙》。以西方历史学方法研究曹家与清皇室的关系，证实了曹家从盛到衰的微观政治史。史景迁的结论：曹家的兴衰是清代"包衣政治"的缩影。</p></div>';

  // 鲁迅
  h+='<div style="padding:10px 0">';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="conf c-high">鲁迅 (1881-1936)</span><span style="font-size:11px;color:var(--t3)">现代文学奠基人</span></div>';
  h+='<p style="font-size:13px;color:var(--t2);padding:4px 10px;background:var(--al);border-radius:4px;font-style:italic">"自有《红楼梦》出来以后，传统的思想和写法都打破了。"</p>';
  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px"><b>史识：</b>鲁迅是最早从"文学史"高度评价《红楼梦》的人。他指出传统小说"好人完全是好，坏人完全是坏"的模式被曹雪芹彻底打破——"和从前的小说叙好人完全是好、坏人完全是坏的大不相同，所以其所叙的人物，都是真的人物。"</p></div>';

  h+='</div></div>';

  // ===== 曹雪芹的创作哲学与当今红学界前沿 =====
  h+='<div class="card"><div class="card-title">🧠 曹雪芹的创作思想</div><div class="card-body">';

  h+='<div style="background:var(--al);padding:10px 14px;border-radius:4px;margin-bottom:8px">';
  h+='<p style="font-size:13px;margin-bottom:4px"><b>1. "追踪蹑迹，不敢稍加穿凿"</b>（第一回自述）</p>';
  h+='<p style="font-size:12px;color:var(--t2)">人物结局不是作者随意决定的，而是人物性格逻辑的必然结果。黛玉必死，不是作者想让读者哭，而是"绛珠还泪"的设定从一开始就规定了她的终点。这是曹雪芹与一般小说家最大的区别。</p></div>';

  h+='<div style="background:var(--al);padding:10px 14px;border-radius:4px;margin-bottom:8px">';
  h+='<p style="font-size:13px;margin-bottom:4px"><b>2. "假作真时真亦假"</b>（太虚幻境对联）</p>';
  h+='<p style="font-size:12px;color:var(--t2)">真假、有无的辩证是全书最根本的哲学立场。任何"黑白分明"的解读都违背了这一哲学。曹雪芹不写纯粹的善或恶——贾政迂腐但有责任感，王夫人念佛但心狠手辣。这种复杂性是"打破了传统写法"的核心。</p></div>';

  h+='<div style="background:var(--al);padding:10px 14px;border-radius:4px;margin-bottom:8px">';
  h+='<p style="font-size:13px;margin-bottom:4px"><b>3. "千红一哭，万艳同悲"</b>（第五回）</p>';
  h+='<p style="font-size:12px;color:var(--t2)">所有女儿都是悲剧——这是全书最刚性的约束之一。不可能有任何一个主要女性角色得到"真正幸福"的结局。巧姐被刘姥姥救出，从公侯小姐变为农妇——这是悲剧中的"温暖例外"，但仍然是阶级坠落，不是幸福。</p></div>';

  h+='<div style="background:var(--al);padding:10px 14px;border-radius:4px;margin-bottom:8px">';
  h+='<p style="font-size:13px;margin-bottom:4px"><b>4. "孤愤假儿女以发之"</b></p>';
  h+='<p style="font-size:12px;color:var(--t2)">鲁迅和王国维都指出：曹雪芹借儿女之情抒发的是对社会、对命运、对人生的"孤愤"。这决定了《红楼梦》不可能是一本简单的爱情小说——它的终极关怀是哲学层面的。续书之所以被斥为"俗"，因为它把对命运的追问降格为家庭伦理剧。</p></div>';

  h+='</div></div>';

  // ===== 中外文学比较 =====
  h+='<div class="card"><div class="card-title">🌍 中外文学比较视野</div><div class="card-body">';

  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">';
  h+='<div style="background:var(--al);padding:10px;border-radius:6px"><div style="font-size:13px;font-weight:700;margin-bottom:4px">🇫🇷 普鲁斯特《追忆似水年华》</div><p style="font-size:12px;color:var(--t2)">两者都以童年记忆的重构为创作起点，都通过"回忆"来重建一个失去的世界。区别：普鲁斯特写的是个人心理时间，曹雪芹写的是家族兴衰史。</p></div>';
  h+='<div style="background:var(--al);padding:10px;border-radius:6px"><div style="font-size:13px;font-weight:700;margin-bottom:4px">🇷🇺 托尔斯泰《战争与和平》</div><p style="font-size:12px;color:var(--t2)">结构上的可比性——鸿篇巨制、多人物、多线索。但托尔斯泰是有神论者，曹雪芹是佛道融合的虚无主义者。托尔斯泰最终给出了"答案"（爱），曹雪芹只呈现"问题"（空）。</p></div>';
  h+='<div style="background:var(--al);padding:10px;border-radius:6px"><div style="font-size:13px;font-weight:700;margin-bottom:4px">🇯🇵 紫式部《源氏物语》</div><p style="font-size:12px;color:var(--t2)">东方"物哀"美学的两个顶峰。区别：源氏物语的"哀"是个人情感的哀伤，红楼梦的"悲"是存在层面的悲剧。曹雪芹比紫式部多了一个"空"的哲学维度。</p></div>';
  h+='<div style="background:var(--al);padding:10px;border-radius:6px"><div style="font-size:13px;font-weight:700;margin-bottom:4px">🇬🇧 莎士比亚《哈姆雷特》</div><p style="font-size:12px;color:var(--t2)">王国维在《红楼梦评论》中首次将《红楼梦》与西方悲剧比较。他认为《红楼梦》是"悲剧中之悲剧"——不是坏人作恶，不是偶然意外，而是"由于人物之位置及关系"的必然悲剧。</p></div>';
  h+='</div>';

  h+='<p style="font-size:12px;color:var(--t3);margin-top:4px">王国维《红楼梦评论》（1904）——第一部系统性地用西方哲学（叔本华）解读《红楼梦》的著作。王国维认为《红楼梦》的悲剧是"彻底的悲剧"，因为它没有给出虚假的安慰。</p></div></div>';

  // ===== 参考文献 =====
  h+='<div class="card"><div class="card-title">📚 参考文献</div><div class="card-body" style="font-size:12px;color:var(--t2);line-height:2">';
  h+='• 胡适《红楼梦考证》（1921）<br>';
  h+='• 俞平伯《红楼梦辨》（1922）<br>';
  h+='• 鲁迅《中国小说史略》（1923）<br>';
  h+='• 周汝昌《红楼梦新证》（1953）<br>';
  h+='• 王国维《红楼梦评论》（1904）<br>';
  h+='• 余英时《红楼梦的两个世界》（1974）<br>';
  h+='• 欧丽娟《大观红楼》系列（2014-2018）<br>';
  h+='• 冯其庸《曹雪芹家世新考》（1980）<br>';
  h+='• 史景迁《曹寅与康熙》（1966）<br>';
  h+='• 蔡义江《红楼梦诗词曲赋鉴赏》（2001）<br>';
  h+='• 梁归智《石头记探佚》（1983）<br>';
  h+='• 高树伟《红楼梦靖藏本辨伪》（2024）<br>';
  h+='• 敦诚《四松堂集》、敦敏《懋斋诗钞》<br>';
  h+='</div></div>';

  getEl('panel-au').innerHTML = h;
}

function renderStats(){
  var html='<div class="stats-grid">';
  html+='<div class="stat-box"><div class="stat-num">'+FORESHADOWINGS.length+'</div><div class="stat-label">结构化伏笔</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+CHARACTERS.length+'</div><div class="stat-label">人物结局</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+CONSTRAINTS.length+'</div><div class="stat-label">逻辑约束</div></div>';
  html+='<div class="stat-box"><div class="stat-num">'+EVENTS.length+'</div><div class="stat-label">重建事件</div></div></div>';
  getEl('panel-ov').innerHTML=html+'<div class="card"><div class="card-title">关于这个项目</div><div class="card-body"><p style="margin-bottom:8px"><b>开源的结构化探佚推理系统</b>。把曹雪芹在前80回中埋下的每一条伏笔、脂砚斋留下的每一条批语、红学家数十年的探佚成果转化为可计算、可验证、可追溯的数据。</p><p style="margin-bottom:8px">核心假设：曹雪芹已写完《红楼梦》全书（110回），后30回因借阅者"迷失"而佚失。大量伏笔和脂批提供了足够的约束条件——这些约束本质上定义了一个逻辑推理问题。</p><p>证据链路线：逐条伏笔 → 约束图 → 逻辑传播 → 一致性验证。</p><p style="margin-top:8px;font-size:13px;color:var(--t2)">评分体系RWCI 6维×18子维度 · 学术论文40篇 · 脂批抄本6种 · 作者研究 · 历史原型 · 开源协作</p></div></div>';

function renderCharacters(filter,search){
  var f=CHARACTERS;if(filter&&filter!=='all')f=f.filter(function(c){return c.significance===filter;});if(search){var s=search.toLowerCase();f=f.filter(function(c){return c.name.indexOf(s)>=0||c.alias.some(function(a){return a.indexOf(s)>=0;})||c.fateSummary.indexOf(s)>=0;});}
  if(!f.length){getEl('panel-ch').innerHTML='<div class="srch"><input type="text" id="chSearch" placeholder="搜索人物..."></div><div class="flt" id="chFilters"><span class="flt-chip active" data-f="all">全部</span><span class="flt-chip" data-f="核心">十二钗正册</span><span class="flt-chip" data-f="重要">副册/又副册</span><span class="flt-chip" data-f="次要">重要配角</span></div><div style="padding:40px;text-align:center;color:var(--t3)">没有找到匹配的人物</div>';return;}
  var h='<div class="srch"><input type="text" id="chSearch" placeholder="搜索人物..."></div><div class="flt" id="chFilters"><span class="flt-chip active" data-f="all">全部</span><span class="flt-chip" data-f="核心">十二钗正册</span><span class="flt-chip" data-f="重要">副册/又副册</span><span class="flt-chip" data-f="次要">重要配角</span></div>';
  for(var i=0;i<f.length;i++){var c=f[i];h+='<div class="card fc"><div class="card-title">'+c.name+' <span style="font-size:11px;color:var(--t3);font-weight:400">'+(c.alias||[]).slice(0,2).join(' / ')+'</span> <span class="conf '+R[c.confidence]+'">'+c.confidence+'</span> <span style="font-size:10px;color:var(--t3)">'+(SIG[c.significance]||c.significance)+'</span></div><div class="card-body"><p style="font-weight:600">'+c.fateSummary+'</p><p style="font-size:13px;color:var(--t2);margin:4px 0">'+c.fateDetail+'</p>';if(c.quote)h+='<p style="font-size:13px;color:var(--g);font-style:italic">「'+c.quote+'」</p>';if(c.supporting&&c.supporting.length){h+='<div style="margin-top:6px;font-size:12px;font-weight:600;color:var(--t2)">支持证据</div>';for(var j=0;j<Math.min(c.supporting.length,5);j++){var fs=fsMap[c.supporting[j]];if(fs)h+='<div class="er"><span class="conf c1" style="font-size:10px">'+fs.evidenceType+'</span><span style="font-family:var(--m);font-size:11px;color:var(--a)">'+fs.id+'</span><span>第'+fs.chapter+'回 · '+(fs.content.length>50?fs.content.slice(0,50)+'...':fs.content)+'</span></div>';}}if(c.alt&&c.alt.length){h+='<div style="margin-top:6px"><span style="cursor:pointer;color:var(--a);font-size:12px" onclick="var d=this.nextElementSibling;d.style.display=d.style.display===\'block\'?\'none\':\'block\';">🔍 查看替代学说 ('+c.alt.length+')</span><div style="display:none;margin-top:4px;padding:8px 10px;background:var(--al);border-radius:4px;font-size:13px">';for(var k=0;k<c.alt.length;k++){var a=c.alt[k];h+='<p style="margin-bottom:6px"><b>'+a.theory+'</b> <span class="conf '+R[a.confidence]+'">'+a.confidence+'</span><br>提出者：'+a.proponent+'<br>'+a.description+'</p>';}h+='</div></div>';}h+='</div></div>';}
  getEl('panel-ch').innerHTML=h;
  var af=getEl('chSearch');var fc=getEl('chFilters');
  af.addEventListener('input',function(){var cf=fc.querySelector('.flt-chip.active');renderCharacters(cf?cf.getAttribute('data-f'):'all',af.value);});
  fc.addEventListener('click',function(e){if(e.target.classList.contains('flt-chip')){var cs=fc.querySelectorAll('.flt-chip');for(var ii=0;ii<cs.length;ii++)cs[ii].classList.remove('active');e.target.classList.add('active');renderCharacters(e.target.getAttribute('data-f'),af.value);}});
}

function renderForeshadowings(){
  var f=FORESHADOWINGS;f.sort(function(a,b){return a.chapter-b.chapter;});
  var h='<div class="srch"><input type="text" id="fsSearch" placeholder="搜索伏笔内容或回目..."></div><div class="flt" id="ffs"><span class="flt-chip active" data-f="all">全部</span><span class="flt-chip" data-f="确定">确定</span><span class="flt-chip" data-f="极有可能">极有可能</span><span class="flt-chip" data-f="脂批直接提示">脂批直接提示</span></div><div id="fsItems">';

  getEl('panel-fs').innerHTML=h+'</div>';
  var af=getEl('fsSearch');var ff=getEl('ffs');
  af.addEventListener('input',function(){var filterVal=ff.querySelector('.flt-chip.active');var fv=filterVal?filterVal.getAttribute('data-f'):'all';var q=af.value.toLowerCase();var items=getEl('fsItems');var cards=items.querySelectorAll('.card');for(var ii=0;ii<cards.length;ii++){cards[ii].style.display='';}var ff=f;if(fv!=='all'){if(fv==='确定'||fv==='极有可能'||fv==='有可能'||fv==='存疑')ff=f.filter(function(x){return x.confidence===fv;});else ff=f.filter(function(x){return x.evidenceType===fv;});}if(q){ff=ff.filter(function(x){return x.content.indexOf(q)>=0||x.context.indexOf(q)>=0||x.id.toLowerCase().indexOf(q)>=0||(x.chapter+'').indexOf(q)>=0;});}var idSet={};for(var jj=0;jj<ff.length;jj++)idSet[ff[jj].id]=true;for(var kk=0;kk<cards.length;kk++){var cid=cards[kk].querySelector('[style*=\"margin-left:auto\"]');var tx=cid?cid.textContent.replace(/\\s/g,''):'';if(!(tx&&idSet[tx]))cards[kk].style.display='none';}});

}
