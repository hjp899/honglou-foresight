<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>探佚成果 — 红楼伏笔 · 后三十回共识推演</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#faf7f2;--panel:#fff;--border:#e5dfd5;--text:#2c2416;--text2:#6b5e4a;--text3:#9b8c78;--accent:#8b2500;--gold:#b8860b;--green:#2d6a4f;--serif:'Noto Serif SC','SimSun',serif;--mono:'IBM Plex Mono',monospace}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--serif);background:var(--bg);color:var(--text);line-height:1.8}.app{max-width:1000px;margin:0 auto;padding:0 20px}.header{padding:40px 0 24px;text-align:center;border-bottom:2px solid var(--accent);margin-bottom:28px}.header h1{font-size:28px;font-weight:700;letter-spacing:3px}.header .subtitle{font-size:15px;color:var(--text2);margin-top:4px}.header .note{font-size:12px;color:var(--text3);margin-top:6px}.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:28px}.stat-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center}.stat-num{font-size:26px;font-weight:700;color:var(--accent);font-family:var(--mono)}.stat-label{font-size:12px;color:var(--text3);margin-top:2px}.section{margin-bottom:32px}.section-title{font-size:19px;font-weight:700;margin-bottom:12px;padding-bottom:4px;border-bottom:1px solid var(--border)}.event-card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:6px;padding:14px 18px;margin-bottom:10px}.evt-chapter{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}.evt-title{font-size:16px;font-weight:700;margin:4px 0}.evt-desc{font-size:14px;color:var(--text2);line-height:1.8}.confidence{display:inline-block;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:600}.c-确定{background:#d4edda;color:var(--green)}.c-极有可能{background:#fff3cd;color:#856404}.c-有可能{background:#e2e3e5;color:#383d41}.fate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.fate-item{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 14px}.fi-name{font-size:15px;font-weight:700}.fi-fate{font-size:13px;color:var(--text2);margin-top:2px}.fi-score{font-size:12px;color:var(--text3);margin-top:2px}.footer{text-align:center;padding:32px 0;color:var(--text3);font-size:12px;border-top:1px solid var(--border);margin-top:32px}@media(max-width:768px){.header h1{font-size:22px}}</style></head>
<body><div class="app"><div class="header"><h1>🏮 探佚成果</h1><p class="subtitle">基于伏笔约束推理的后三十回共识推演 · 数据驱动 · 实时更新</p><p class="note">每次社区合并新数据后自动刷新</p></div><div class="stats-row" id="statsRow"></div><div class="section"><div class="section-title">📜 后三十回事件时间线</div><div id="timelineContainer"></div></div><div class="section"><div class="section-title">👤 人物结局一览</div><div class="fate-grid" id="fateGrid"></div></div><div class="footer">数据由 <a href="index.html" style="color:var(--accent)">红楼伏笔</a> 推理引擎 v3.0 自动生成 · 开源协作</div></div>
<script>
(async function(){
  async function load(path){try{const r=await fetch(path);return await r.json();}catch(e){return null;}}
  const c1=await load('data/characters.json'),c2=await load('data/characters_batch2.json');
  const f1=await load('data/foreshadowing.json'),f2=await load('data/foreshadowing_batch2.json');
  const cs1=await load('data/constraints.json'),cs2=await load('data/constraints_batch2.json');
  const e1=await load('data/events.json'),e2=await load('data/events_batch2.json');
  const characters=[...(c1?.characters||[]),...(Array.isArray(c2)?c2:c2?.characters||[])];
  const events=[...(e1?.events||[]),...(Array.isArray(e2)?e2:e2?.events||[])];
  const constraints=[...(cs1?.constraints||[]),...(Array.isArray(cs2)?cs2:cs2?.constraints||[])];
  document.getElementById('statsRow').innerHTML=[{l:'伏笔',v:(f1?.foreshadowings||[]).length+(Array.isArray(f2)?f2:f2?.foreshadowings||[]).length,c:'#8b2500'},{l:'人物',v:characters.length,c:'#1d3557'},{l:'约束',v:constraints.length,c:'#b8860b'},{l:'事件',v:events.length,c:'#2d6a4f'}].map(s=>'<div class="stat-box"><div class="stat-num" style="color:'+s.c+'">'+s.v+'</div><div class="stat-label">'+s.l+'</div></div>').join('');
  const sorted=[...events].sort((a,b)=>(a.chapter||999)-(b.chapter||999));
  document.getElementById('timelineContainer').innerHTML=sorted.map(e=>{const cn=(e.characters||[]).map(cid=>{const ch=characters.find(c=>c.id===cid);return ch?ch.name:cid;}).join(' · ');return'<div class="event-card"><div class="evt-chapter">第'+e.chapter+'回（推算）</div><div class="evt-title">'+e.title+' <span class="confidence c-'+e.confidence+'">'+e.confidence+'</span></div><div class="evt-desc">'+e.description+'</div><div style="font-size:12px;color:var(--text3);margin-top:4px">👥 '+(cn||'—')+'</div></div>';}).join('');
  document.getElementById('fateGrid').innerHTML=characters.map(c=>'<div class="fate-item"><div class="fi-name">'+c.name+'</div><div class="fi-fate">'+c.fateSummary+'</div><div class="fi-score">证据:'+(c.supportingForeshadowings||[]).length+'条 · '+c.confidence+'</div></div>').join('');
})();
</script></body></html>
